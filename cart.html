<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Cart - Tech Inventory</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="cart-page">

  <header>
    <div class="header-left">
      <img src="images/logo.png" class="logo" alt="Logo">
      <h1>Tech Inventory</h1>
    </div>

    <nav>
      <a href="index.html">Home</a>
      <a href="products.html?category=phones">Phones</a>
      <a href="products.html?category=tablets">Tablets</a>
      <a href="products.html?category=laptops">Laptops</a>

      <a href="products.html?category=accessories">Accessories</a>

  <main class="cart-main">

    <div class="cart-page-header">
      <h2>Your Shopping Cart</h2>
    </div>

    <div class="cart-layout">

      <section class="cart-items-card">
        <div id="cart-contents"></div>
      </section>

      <aside
        class="cart-summary"
        id="cart-actions">
      </aside>

    </div>

  </main>

  <footer>
    <p>&copy; 2026 Tech Inventory</p>
  </footer>

  <script src="js/toast.js"></script>
  <script src="js/products.js"></script>

  <script src="js/chatbot.js"></script>
